# Dependabot configuration


version: 2
updates:
  # 1️⃣ Update NPM dependencies daily
  - package-ecosystem: "npm"
    directory: "/"                 # Root of your project
    schedule:
      interval: "daily"            # Check daily
    open-pull-requests-limit: 5    # Max 5 open PRs at a time
    rebase-strategy: "auto"        # Automatically rebase outdated PRs
    commit-message:
      prefix: "chore(deps)"        # Commit message prefix
    reviewers:
      - "Muhammad Inam Ullah"      # Add yourself as reviewer
    pull-request-branch-name:
      separator: "/"               # Branch naming convention

  # 2️⃣ Update GitHub Actions workflows daily
  - package-ecosystem: "github-actions"
    directory: "/"                 
    schedule:
      interval: "daily"
    pull-request-branch-name:
      separator: "/"
