name: Continuous Integration

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'     # corrected from '-v*'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "Lock file found — running npm ci"
            npm ci
          else
            echo "No lock file found — running npm install"
            npm install
          fi

      # Step 4: Run Linter (if available)
      - name: Run Linter
        run: |
          if npm run | grep -q "lint"; then
            echo "Lint script found — running lint..."
            npm run lint --silent
          else
            echo "No lint script found — skipping linting."
          fi

      # Step 5: Run Tests (if available)
      - name: Run Tests
        run: |
          if npm run | grep -q "test"; then
            echo "Test script found — running tests..."
            npm test --silent || (echo "Tests failed"; exit 1)
          else
            echo "No test script found — skipping tests."
          fi

      # Step 6: Build Project (if available)
      - name: Build Project
        run: |
          if npm run | grep -q "build"; then
            echo "Build script found — running build..."
            npm run build --silent
          else
            echo "No build script found — skipping build."
          fi
