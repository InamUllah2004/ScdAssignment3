name: Generate Release Notes

on:
  push:
    tags:
      - "v*.*.*"   # Trigger only when version tags are pushed, e.g., v1.0.0

permissions:
  contents: write

jobs:
  generate-release-notes:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Fetch all commits for changelog

      # Step 2: Get recent commits
      - name: Generate release notes content
        id: notes
        run: |
          echo "## 🚀 Release Notes for ${GITHUB_REF#refs/tags/}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "**Date:** $(date)" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Commits included in this release:" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          git log -10 --pretty=format:"- %s (%an)" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "✅ Automatically generated by GitHub Actions." >> RELEASE_NOTES.md

      # Step 3: Commit and push release notes
      - name: Commit release notes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add RELEASE_NOTES.md
          git commit -m "📦 Update release notes for ${GITHUB_REF#refs/tags/}"
          git push origin HEAD:main
